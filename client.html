<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>State Data Explorer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <style>
        .loading {
            opacity: 0.5;
            pointer-events: none;
        }
        #errorMessage {
            display: none;
            margin-top: 1rem;
        }
        .select2-container {
            width: 100% !important;
        }
        .button-group {
            display: flex;
            gap: 10px;
        }
    </style>
</head>

<body>
    <div class="container mt-5">
        <h1 class="mb-4">State Data Explorer</h1>
        
        <div class="row mb-4">
            <div class="col-md-6 mb-3">
                <label for="stateSelect" class="form-label">Select States:</label>
                <select class="form-select" id="stateSelect" multiple="multiple">
                    <option value="" disabled>Loading states...</option>
                </select>
            </div>
            <div class="col-md-6 mb-3">
                <label for="citySelect" class="form-label">Select Cities:</label>
                <select class="form-select" id="citySelect" multiple="multiple">
                    <option value="" disabled>Select states first...</option>
                </select>
            </div>
        </div>

        <div class="alert alert-danger" id="errorMessage" role="alert"></div>

        <div class="button-group mb-3">
            <button id="queryData" class="btn btn-primary">
                <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                Query Selected Data
            </button>
            <button id="clearData" class="btn btn-secondary">Clear Results</button>
        </div>

        <div id="result" class="mt-4">
            <table class="table table-striped table-bordered">
                <thead id="resultHeader"></thead>
                <tbody id="resultBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            const errorMessage = $('#errorMessage');
            const queryButton = $('#queryData');
            const clearButton = $('#clearData');
            const spinner = queryButton.find('.spinner-border');
            const resultDiv = $('#result');
            
            // Initialize Select2 for both dropdowns
            const stateSelect = $('#stateSelect').select2({
                placeholder: 'Select states to query',
                allowClear: true
            });

            const citySelect = $('#citySelect').select2({
                placeholder: 'Select cities to filter',
                allowClear: true
            });

            function showError(message) {
                errorMessage.text(message).show();
                setTimeout(() => errorMessage.fadeOut(), 5000);
            }

            function setLoading(isLoading) {
                if (isLoading) {
                    spinner.removeClass('d-none');
                    queryButton.addClass('loading');
                } else {
                    spinner.addClass('d-none');
                    queryButton.removeClass('loading');
                }
            }

            function clearResults() {
                resultDiv.html('<table class="table table-striped table-bordered"><thead id="resultHeader"></thead><tbody id="resultBody"></tbody></table>');
                citySelect.val(null).trigger('change');
                stateSelect.val(null).trigger('change');
            }

            // Load available states
            fetch('http://127.0.0.1:5000/states')
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    if (!data || !data.states) {
                        throw new Error('Invalid response format from server');
                    }
                    
                    // Clear loading option
                    stateSelect.empty();
                    
                    if (data.states.length === 0) {
                        showError('No states found in the data');
                        return;
                    }

                    // Add states to select
                    data.states.forEach(state => {
                        const option = new Option(state, state);
                        stateSelect.append(option);
                    });
                })
                .catch(error => {
                    showError('Error loading states: ' + error.message);
                });

            // Update cities when states are selected
            stateSelect.on('change', function() {
                const selectedStates = $(this).val();
                citySelect.empty();
                
                if (!selectedStates || selectedStates.length === 0) {
                    citySelect.append(new Option('Select states first...', '')).trigger('change');
                    return;
                }

                fetch('http://127.0.0.1:5000/cities', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ states: selectedStates }),
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    if (data.error) {
                        throw new Error(data.error);
                    }
                    
                    citySelect.empty();
                    
                    if (!data.cities || data.cities.length === 0) {
                        citySelect.append(new Option('No cities found', '')).trigger('change');
                        return;
                    }

                    data.cities.forEach(city => {
                        citySelect.append(new Option(city, city));
                    });
                })
                .catch(error => {
                    showError('Error loading cities: ' + error.message);
                });
            });

            // Handle clear button click
            clearButton.click(clearResults);

            // Handle query button click
            queryButton.click(function() {
                const selectedStates = stateSelect.val();
                const selectedCities = citySelect.val();
                
                if (!selectedStates || selectedStates.length === 0) {
                    showError('Please select at least one state');
                    return;
                }

                setLoading(true);

                fetch('http://127.0.0.1:5000/query', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        states: selectedStates,
                        cities: selectedCities || []
                    }),
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    if (data.error) {
                        throw new Error(data.error);
                    }
                    displayResult(data.result);
                })
                .catch(error => {
                    showError('Error: ' + error.message);
                })
                .finally(() => {
                    setLoading(false);
                });
            });

            function displayResult(result) {
                if (!result || result.length === 0) {
                    resultDiv.html('<p>No results found.</p>');
                    return;
                }

                const headers = Object.keys(result[0]);
                let headerHtml = '<tr>';
                headers.forEach(function(header) {
                    headerHtml += '<th>' + header + '</th>';
                });
                headerHtml += '</tr>';
                document.getElementById('resultHeader').innerHTML = headerHtml;

                let bodyHtml = '';
                result.forEach(function(row) {
                    bodyHtml += '<tr>';
                    headers.forEach(function(header) {
                        bodyHtml += '<td>' + (row[header] !== null ? row[header] : '') + '</td>';
                    });
                    bodyHtml += '</tr>';
                });
                document.getElementById('resultBody').innerHTML = bodyHtml;
            }
        });
    </script>
</body>

</html>
