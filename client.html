<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Explorer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <style>
        .loading {
            opacity: 0.5;
            pointer-events: none;
        }
        #errorMessage {
            display: none;
            margin-top: 1rem;
        }
        .select2-container {
            width: 100% !important;
        }
        .button-group {
            display: flex;
            gap: 10px;
        }
    </style>
</head>

<body>
    <div class="container mt-5">
        <h1 class="mb-4" id="pageTitle">Data Explorer</h1>
        
        <div class="row mb-4">
            <div class="col-md-6 mb-3">
                <label id="primaryLabel" for="primarySelect" class="form-label">Primary Filter:</label>
                <select class="form-select" id="primarySelect" multiple="multiple">
                    <option value="" disabled>Primary values</option>
                </select>
            </div>
            <div class="col-md-6 mb-3">
                <label id="secondaryLabel" for="secondarySelect" class="form-label">Secondary Filter:</label>
                <select class="form-select" id="secondarySelect" multiple="multiple">
                    <option value="" disabled>Select primary values first...</option>
                </select>
            </div>
        </div>

        <div class="alert alert-danger" id="errorMessage" role="alert"></div>

        <div class="button-group mb-3">
            <button id="queryData" class="btn btn-primary">
                <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                Query Data
            </button>
            <button id="clearData" class="btn btn-secondary">Clear</button>
        </div>

        <div id="result" class="mt-4">
            <table class="table table-striped table-bordered">
                <thead id="resultHeader"></thead>
                <tbody id="resultBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            const errorMessage = $('#errorMessage');
            const queryButton = $('#queryData');
            const clearButton = $('#clearData');
            const spinner = queryButton.find('.spinner-border');
            const resultDiv = $('#result');
            let config = null;
            
            // Initialize Select2 elements
            const primarySelect = $('#primarySelect').select2({
                placeholder: 'Loading...',
                allowClear: true
            });

            const secondarySelect = $('#secondarySelect').select2({
                placeholder: 'Select primary values first...',
                allowClear: true
            });
            
            function showError(message) {
                errorMessage.text(message).show();
                setTimeout(() => errorMessage.fadeOut(), 5000);
            }

            function setLoading(isLoading) {
                if (isLoading) {
                    spinner.removeClass('d-none');
                    queryButton.addClass('loading');
                } else {
                    spinner.addClass('d-none');
                    queryButton.removeClass('loading');
                }
            }

            function clearResults() {
                resultDiv.html('<table class="table table-striped table-bordered"><thead id="resultHeader"></thead><tbody id="resultBody"></tbody></table>');
                primarySelect.val(null).trigger('change');
                secondarySelect.val(null).trigger('change');
            }

            // Load configuration
            fetch('http://127.0.0.1:5000/config')
                .then(response => response.json())
                .then(data => {
                    config = data;
                    
                    // Update UI text
                    document.title = config.ui.title;
                    $('#pageTitle').text(config.ui.title);
                    $('#primaryLabel').text(config.primary_filter.name + ':');
                    $('#secondaryLabel').text(config.secondary_filter.name + ':');
                    $('#queryData').text(config.ui.query_button_text);
                    $('#clearData').text(config.ui.clear_button_text);
                    
                    // Update Select2 placeholders
                    primarySelect.data('placeholder', config.ui.primary_placeholder);
                    secondarySelect.data('placeholder', config.ui.secondary_placeholder);
                    
                    // Trigger placeholder update
                    primarySelect.trigger('change');
                    secondarySelect.trigger('change');

                    // Load primary values
                    loadPrimaryValues();
                })
                .catch(error => {
                    showError('Error loading configuration: ' + error.message);
                });

            function loadPrimaryValues() {
                fetch('http://127.0.0.1:5000/primary')
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`HTTP error! status: ${response.status}`);
                        }
                        return response.json();
                    })
                    .then(data => {
                        if (!data || !data.values) {
                            throw new Error('Invalid response format from server');
                        }
                        
                        // Clear loading option
                        primarySelect.empty();
                        
                        if (data.values.length === 0) {
                            showError('No primary values found in the data');
                            return;
                        }

                        // Add values to select
                        data.values.forEach(value => {
                            primarySelect.append(new Option(value, value));
                        });
                    })
                    .catch(error => {
                        showError('Error loading primary values: ' + error.message);
                    });
            }

            // Update secondary values when primary selection changes
            primarySelect.on('change', function() {
                const selectedValues = $(this).val();
                secondarySelect.empty();
                
                if (!selectedValues || selectedValues.length === 0) {
                    if (config) {
                        secondarySelect.append(new Option(config.ui.primary_placeholder, '')).trigger('change');
                    }
                    return;
                }

                fetch('http://127.0.0.1:5000/secondary', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ primary_values: selectedValues }),
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    if (data.error) {
                        throw new Error(data.error);
                    }
                    
                    secondarySelect.empty();
                    
                    if (!data.values || data.values.length === 0) {
                        secondarySelect.append(new Option(config.ui.no_results_text, '')).trigger('change');
                        return;
                    }

                    data.values.forEach(value => {
                        secondarySelect.append(new Option(value, value));
                    });
                })
                .catch(error => {
                    showError('Error loading secondary values: ' + error.message);
                });
            });

            // Handle clear button click
            clearButton.click(clearResults);

            // Handle query button click
            queryButton.click(function() {
                const primaryValues = primarySelect.val();
                const secondaryValues = secondarySelect.val();
                
                if (!primaryValues || primaryValues.length === 0) {
                    showError(`Please select at least one ${config.primary_filter.name.toLowerCase()}`);
                    return;
                }

                setLoading(true);

                fetch('http://127.0.0.1:5000/query', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        primary_values: primaryValues,
                        secondary_values: secondaryValues || []
                    }),
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    if (data.error) {
                        throw new Error(data.error);
                    }
                    displayResult(data.result);
                })
                .catch(error => {
                    showError('Error: ' + error.message);
                })
                .finally(() => {
                    setLoading(false);
                });
            });

            function displayResult(result) {
                if (!result || result.length === 0) {
                    resultDiv.html(`<p>${config.ui.no_results_text}</p>`);
                    return;
                }

                const headers = Object.keys(result[0]);
                let headerHtml = '<tr>';
                headers.forEach(function(header) {
                    headerHtml += '<th>' + header + '</th>';
                });
                headerHtml += '</tr>';
                document.getElementById('resultHeader').innerHTML = headerHtml;

                let bodyHtml = '';
                result.forEach(function(row) {
                    bodyHtml += '<tr>';
                    headers.forEach(function(header) {
                        bodyHtml += '<td>' + (row[header] !== null ? row[header] : '') + '</td>';
                    });
                    bodyHtml += '</tr>';
                });
                document.getElementById('resultBody').innerHTML = bodyHtml;
            }
        });
    </script>
</body>

</html>
