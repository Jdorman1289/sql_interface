<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQL Query Interface</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .filter-row {
            margin-bottom: 1rem;
            padding: 1rem;
            border: 1px solid #dee2e6;
            border-radius: 0.25rem;
            background-color: #f8f9fa;
        }
        .results-table {
            margin-top: 2rem;
        }
        .table-container {
            max-height: 500px;
            overflow-y: auto;
            margin-top: 20px;
            overflow-x: auto;
        }
        .filter-group {
            margin-bottom: 15px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">SQL Query Interface</h1>

        <div id="findFilesSection" class="mb-4">
             <h3>Find Parquet Files</h3>
             <p class="text-muted">Add filters to find parquet files containing matching data.</p>
             <div id="filters"></div>
             <div class="mt-2">
                 <button class="btn btn-secondary" onclick="addFilter()">Add Filter</button>
             </div>
             <div class="mt-3">
                <button class="btn btn-info" onclick="findFiles()" id="findFilesButton">Find Matching Files</button>
            </div>
        </div>

        <div id="customSqlSection" class="mt-4">
            <h3>Custom SQL Query</h3>
            <p class="text-muted">Enter your SQL query below (e.g., SELECT * FROM all_data WHERE condition LIMIT 10). Primarily SELECT, DESCRIBE, SHOW are allowed.</p>
            <div class="form-group">
                <textarea id="sqlQueryInput" class="form-control" rows="6" placeholder="SELECT * FROM all_data LIMIT 10"></textarea>
            </div>
             <div class="mt-3">
                 <button class="btn btn-primary" onclick="executeCustomSql()" id="executeSqlButton">Execute SQL</button>
             </div>
        </div>

        <div class="mt-4" id="resultActionButtons" style="display: none;">
             <div class="d-flex gap-2">
                 <button class="btn btn-success" onclick="exportToCsv()" id="exportButton">Export Results to CSV</button>
                 <button class="btn btn-danger" onclick="clearAll()" id="clearButton">Clear Results & Filters</button>
             </div>
        </div>

        <div id="resultsSection" style="display: none;" class="mt-4">
            <h3 id="resultsTitle">Results</h3>
            <div id="resultsContent"> 
                 <!-- Results (table or list) will be inserted here -->
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const operators = [
            {value: "=", label: "equals"},
            {value: "!=", label: "not equals"},
            {value: ">", label: "greater than"},
            {value: "<", label: "less than"},
            {value: ">=", label: "greater than or equal"},
            {value: "<=", label: "less than or equal"},
            {value: "IN", label: "in list (comma-sep)"},
            {value: "NOT IN", label: "not in list (comma-sep)"},
            {value: "LIKE", label: "contains (case-sensitive)"}
        ];

        let queryResults = null; 
        let parquetFiles = null; 
        const API_BASE_URL = 'http://127.0.0.1:5001'; 

        function createOperatorSelect() {
            const select = document.createElement('select');
            select.className = 'form-select operator-select';
            select.innerHTML = '<option value="">Select Operator</option>' +
                operators.map(op =>
                    `<option value="${op.value}">${op.label}</option>`
                ).join('');
            return select;
        }

        function createColumnInput() {
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'form-control column-input';
            input.placeholder = 'Column Name';
            return input;
        }

        function addFilter() {
            const filterContainer = document.createElement('div');
            filterContainer.className = 'filter-row d-flex align-items-center gap-2'; 

            const colInput = createColumnInput();

            const opSelect = createOperatorSelect();

            const valueInput = document.createElement('input');
            valueInput.type = 'text';
            valueInput.className = 'form-control value-input flex-grow-1'; 
            valueInput.placeholder = 'Value (use comma for IN/NOT IN lists)';

            const removeBtn = document.createElement('button');
            removeBtn.textContent = 'Remove';
            removeBtn.className = 'btn btn-outline-danger btn-sm';
            removeBtn.onclick = () => filterContainer.remove();

            filterContainer.appendChild(colInput);
            filterContainer.appendChild(opSelect);
            filterContainer.appendChild(valueInput);
            filterContainer.appendChild(removeBtn);

            document.getElementById('filters').appendChild(filterContainer);
        }

        function getFilters() {
            const filters = [];
            document.querySelectorAll('.filter-row').forEach(row => {
                const columnInput = row.querySelector('.column-input');
                const operatorSelect = row.querySelector('.operator-select');
                const valueInput = row.querySelector('.value-input');

                const column = columnInput.value.trim();
                const operator = operatorSelect.value;
                let value = valueInput.value.trim();

                if (column && operator && value) {
                    if (operator === 'IN' || operator === 'NOT IN') {
                        value = value.split(',').map(s => s.trim()).filter(s => s !== '');
                        if (value.length === 0) return; 
                    }

                    filters.push({ column, operator, value });
                }
            });
            return filters;
        }

        async function findFiles() {
            clearResults();
            const filters = getFilters();
            console.log("Finding files with filters:", filters);

            try {
                const response = await fetch(`${API_BASE_URL}/query`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ filters })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || `HTTP error ${response.status}`);
                }

                parquetFiles = data.parquet_files || [];
                displayParquetFiles(parquetFiles);
                document.getElementById('resultActionButtons').style.display = 'none'; 

            } catch (error) {
                console.error('Error finding files:', error);
                displayError(`Error finding files: ${error.message}`);
                parquetFiles = null;
            }
        }

        async function executeCustomSql() {
            clearResults();
            const sql = document.getElementById('sqlQueryInput').value.trim();
            if (!sql) {
                alert('Please enter a SQL query.');
                return;
            }
            console.log("Executing SQL:", sql);

            try {
                const response = await fetch(`${API_BASE_URL}/execute_sql`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sql })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || `HTTP error ${response.status}`);
                }

                queryResults = data.results || [];
                if (queryResults.length > 0) {
                    displayResultsTable(queryResults);
                    document.getElementById('resultActionButtons').style.display = 'block';
                } else {
                    displayMessage("Query executed successfully, but returned no results.");
                    document.getElementById('resultActionButtons').style.display = 'none';
                }

            } catch (error) {
                console.error('Error executing SQL:', error);
                displayError(`Error executing SQL: ${error.message}`);
                queryResults = null;
                document.getElementById('resultActionButtons').style.display = 'none';
            }
        }

        function displayResultsTable(results) {
            const resultsContent = document.getElementById('resultsContent');
            const resultsSection = document.getElementById('resultsSection');
            const resultsTitle = document.getElementById('resultsTitle');

            resultsContent.innerHTML = ''; 
            resultsTitle.textContent = 'Query Results';

            if (!results || results.length === 0) {
                resultsContent.innerHTML = '<p class="text-muted">No results found.</p>';
                resultsSection.style.display = 'block';
                return;
            }

            const table = document.createElement('table');
            table.className = 'table table-striped table-bordered table-sm'; 

            const thead = document.createElement('thead');
            const headerRow = document.createElement('tr');
            Object.keys(results[0]).forEach(key => {
                const th = document.createElement('th');
                th.textContent = key;
                headerRow.appendChild(th);
            });
            thead.appendChild(headerRow);
            table.appendChild(thead);

            const tbody = document.createElement('tbody');
            results.forEach(row => {
                const tr = document.createElement('tr');
                Object.values(row).forEach(value => {
                    const td = document.createElement('td');
                    td.textContent = (value === null || value === undefined) ? 'NULL' : value;
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
            table.appendChild(tbody);

            const tableContainer = document.createElement('div');
            tableContainer.className = 'table-container';
            tableContainer.appendChild(table);
            resultsContent.appendChild(tableContainer);
            resultsSection.style.display = 'block';
        }

        function displayParquetFiles(files) {
            const resultsContent = document.getElementById('resultsContent');
            const resultsSection = document.getElementById('resultsSection');
            const resultsTitle = document.getElementById('resultsTitle');

            resultsContent.innerHTML = ''; 
            resultsTitle.textContent = 'Matching Parquet Files';

            if (!files || files.length === 0) {
                resultsContent.innerHTML = '<p class="text-muted">No matching parquet files found.</p>';
            } else {
                const list = document.createElement('ul');
                list.className = 'list-group';
                files.forEach(file => {
                    const li = document.createElement('li');
                    li.className = 'list-group-item d-flex justify-content-between align-items-center';
                    li.textContent = file;

                    list.appendChild(li);
                });
                resultsContent.appendChild(list);
            }
            resultsSection.style.display = 'block';
        }

        function displayMessage(message) {
            const resultsContent = document.getElementById('resultsContent');
            const resultsSection = document.getElementById('resultsSection');
            const resultsTitle = document.getElementById('resultsTitle');
            resultsContent.innerHTML = `<p class="text-info">${message}</p>`;
            resultsTitle.textContent = 'Status';
            resultsSection.style.display = 'block';
        }

        function displayError(errorMessage) {
            const resultsContent = document.getElementById('resultsContent');
            const resultsSection = document.getElementById('resultsSection');
            const resultsTitle = document.getElementById('resultsTitle');
            resultsContent.innerHTML = `<div class="alert alert-danger" role="alert">${errorMessage}</div>`;
            resultsTitle.textContent = 'Error';
            resultsSection.style.display = 'block';
        }

        function exportToCsv() {
            if (!queryResults || queryResults.length === 0) {
                alert('No results to export.');
                return;
            }

            const headers = Object.keys(queryResults[0]);
            const csvRows = [];
            csvRows.push(headers.join(',')); 

            queryResults.forEach(row => {
                const values = headers.map(header => {
                    const escaped = ('' + (row[header] === null || row[header] === undefined ? '' : row[header])).replace(/"/g, '\""'); 
                    return `"${escaped}"`; 
                });
                csvRows.push(values.join(','));
            });

            const csvString = csvRows.join('\r\n');
            const blob = new Blob([csvString], { type: 'text/csv;charset=utf-8;' });

            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.setAttribute('href', url);
            link.setAttribute('download', 'query_results.csv');
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function clearResults() {
            document.getElementById('resultsContent').innerHTML = '';
            document.getElementById('resultsSection').style.display = 'none';
            document.getElementById('resultActionButtons').style.display = 'none';
            queryResults = null;
            parquetFiles = null;
        }

        function clearAll() {
            document.getElementById('filters').innerHTML = '';
            addFilter(); 
            document.getElementById('sqlQueryInput').value = '';
            clearResults();
        }

        addFilter(); 
    </script>
</body>
</html>
