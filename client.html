<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Query Interface</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <style>
        .filter-row {
            margin-bottom: 1rem;
            padding: 1rem;
            border: 1px solid #dee2e6;
            border-radius: 0.25rem;
            background-color: #f8f9fa;
        }
        .results-table {
            margin-top: 2rem;
        }
        .table-container {
            max-height: 500px;
            overflow-y: auto;
        }
        #queryBuilder {
            margin-bottom: 2rem;
        }
        .order-row {
            margin-top: 1rem;
        }
        .table-container {
            margin-top: 20px;
            overflow-x: auto;
        }
        .form-select {
            margin-bottom: 10px;
        }
        .filter-group {
            margin-bottom: 15px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .data-mode-only {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">Data Query Interface</h1>
        
        <div id="queryBuilder">
            <div class="mb-3">
                <label class="form-label">Query Mode:</label>
                <select id="queryMode" class="form-select" onchange="onModeChange()">
                    <option value="data">Query Data</option>
                    <option value="parquet">Find Parquet Files</option>
                </select>
            </div>

            <h3>Filters</h3>
            <div id="filters"></div>
            <div class="mt-2">
                <button class="btn btn-secondary" onclick="addFilter()">Add Filter</button>
            </div>

            <div id="ordering" class="data-mode-only mt-4">
                <h3>Ordering</h3>
                <div id="orderingList"></div>
                <button class="btn btn-secondary mt-2" onclick="addOrder()">Add Order</button>
            </div>
            
            <div class="mt-4 data-mode-only">
                <label for="limitInput" class="form-label">Limit Results</label>
                <input type="number" class="form-control" id="limitInput" min="1" value="100">
            </div>

            <div class="mt-5" id="actionButtons">
                <div class="d-flex gap-2">
                    <button class="btn btn-info" onclick="executeQuery()" id="executeButton">Find Files</button>
                    <button class="btn btn-success" onclick="exportToCsv()" id="exportButton" style="display: none;">Export to CSV</button>
                    <button class="btn btn-danger" onclick="clearAll()" id="clearButton" style="display: none;">Clear All</button>
                </div>
            </div>
        </div>

        <div id="resultsSection" style="display: none;">
            <h3 id="resultsTitle">Query Results</h3>
            <div class="table-container">
                <table class="table table-striped">
                    <thead id="resultsHeader"></thead>
                    <tbody id="resultsBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    
    <script>
        let config = {
            available_columns: [],
            operators: []
        };

        let queryResults = null; // Store the query results globally
        let parquetFiles = null;

        async function loadConfig() {
            try {
                const response = await fetch('http://127.0.0.1:5000/config');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                if (data.error) {
                    throw new Error(data.error);
                }
                
                // Update config with received data
                config.available_columns = data.available_columns || [];
                config.operators = data.operators || [];
                
                // Initialize the interface
                addFilter();
                addOrder();
            } catch (error) {
                console.error('Error loading config:', error);
                alert('Failed to load configuration. Please check the server logs and refresh the page.');
            }
        }

        async function getDistinctValues(column) {
            try {
                const response = await fetch('http://127.0.0.1:5000/distinct', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ column })
                });
                const data = await response.json();
                return data.values || [];
            } catch (error) {
                console.error('Error getting distinct values:', error);
                return [];
            }
        }

        function createColumnSelect(containerId, onChange) {
            const select = document.createElement('select');
            select.className = 'form-select column-select';
            select.innerHTML = '<option value="">Select Column</option>' +
                (config.available_columns || []).map(col => 
                    `<option value="${col}">${col}</option>`
                ).join('');
            select.onchange = onChange;
            return select;
        }

        function createOperatorSelect() {
            const select = document.createElement('select');
            select.className = 'form-select operator-select';
            select.innerHTML = '<option value="">Select Operator</option>' +
                config.operators.map(op => 
                    `<option value="${op.value}">${op.label}</option>`
                ).join('');
            return select;
        }

        function addFilter() {
            const filterContainer = document.createElement('div');
            filterContainer.className = 'filter-row';
            
            const row = document.createElement('div');
            row.className = 'row';
            
            // Column select
            const colDiv = document.createElement('div');
            colDiv.className = 'col';
            const colSelect = createColumnSelect('column', () => {
                // Clear and update value input when column changes
                valueInput.value = '';
                valueInput.style.display = 'block';
                valueSelect.style.display = 'none';
            });
            colDiv.appendChild(colSelect);
            
            // Operator select
            const opDiv = document.createElement('div');
            opDiv.className = 'col';
            const opSelect = createOperatorSelect();
            opDiv.appendChild(opSelect);
            
            // Value input/select
            const valueDiv = document.createElement('div');
            valueDiv.className = 'col';
            const valueInput = document.createElement('input');
            valueInput.className = 'form-control value-input';
            valueInput.placeholder = 'Enter value';
            
            const valueSelect = document.createElement('select');
            valueSelect.className = 'form-control value-select';
            valueSelect.style.display = 'none';
            valueSelect.multiple = true;
            
            valueDiv.appendChild(valueInput);
            valueDiv.appendChild(valueSelect);
            
            // Remove button
            const removeDiv = document.createElement('div');
            removeDiv.className = 'col-auto';
            const removeBtn = document.createElement('button');
            removeBtn.className = 'btn btn-danger';
            removeBtn.innerHTML = 'Remove';
            removeBtn.onclick = () => filterContainer.remove();
            removeDiv.appendChild(removeBtn);
            
            row.appendChild(colDiv);
            row.appendChild(opDiv);
            row.appendChild(valueDiv);
            row.appendChild(removeDiv);
            filterContainer.appendChild(row);
            
            document.getElementById('filters').appendChild(filterContainer);
            
            // Initialize Select2 for the value select
            $(valueSelect).select2({
                width: '100%',
                tags: true,
                tokenSeparators: [',', ' ']
            });
        }

        function addOrder() {
            const orderContainer = document.createElement('div');
            orderContainer.className = 'order-row';
            
            const row = document.createElement('div');
            row.className = 'row';
            
            // Column select
            const colDiv = document.createElement('div');
            colDiv.className = 'col';
            const colSelect = createColumnSelect('orderColumn');
            colDiv.appendChild(colSelect);
            
            // Direction select
            const dirDiv = document.createElement('div');
            dirDiv.className = 'col';
            const dirSelect = document.createElement('select');
            dirSelect.className = 'form-select direction-select';
            dirSelect.innerHTML = `
                <option value="">Select Direction</option>
                <option value="ASC">Ascending</option>
                <option value="DESC">Descending</option>
            `;
            dirDiv.appendChild(dirSelect);
            
            // Remove button
            const removeDiv = document.createElement('div');
            removeDiv.className = 'col-auto';
            const removeBtn = document.createElement('button');
            removeBtn.className = 'btn btn-danger';
            removeBtn.innerHTML = 'Remove';
            removeBtn.onclick = () => orderContainer.remove();
            removeDiv.appendChild(removeBtn);
            
            row.appendChild(colDiv);
            row.appendChild(dirDiv);
            row.appendChild(removeDiv);
            orderContainer.appendChild(row);
            
            document.getElementById('orderingList').appendChild(orderContainer);
        }

        function getFilters() {
            const filters = [];
            document.querySelectorAll('.filter-row').forEach(row => {
                const column = row.querySelector('.column-select').value;
                const operator = row.querySelector('.operator-select').value;
                const valueInput = row.querySelector('.value-input');
                const valueSelect = row.querySelector('.value-select');
                
                if (column && operator) {
                    let value;
                    if (valueSelect.style.display === 'none') {
                        value = valueInput.value;
                        // Convert to number if possible
                        if (!isNaN(value) && value !== '') {
                            value = Number(value);
                        }
                    } else {
                        value = $(valueSelect).select2('data').map(item => item.text);
                    }
                    
                    filters.push({ column, operator, value });
                }
            });
            return filters;
        }

        function getOrders() {
            const orders = [];
            document.querySelectorAll('.order-row').forEach(row => {
                const column = row.querySelector('.column-select').value;
                const direction = row.querySelector('.direction-select').value;
                if (column && direction) {
                    orders.push({ column, direction });
                }
            });
            return orders;
        }

        function onModeChange() {
            const mode = document.getElementById('queryMode').value;
            // Hide/show elements based on mode
            const dataModeElements = document.querySelectorAll('.data-mode-only');
            dataModeElements.forEach(element => {
                element.style.display = mode === 'data' ? 'block' : 'none';
            });
            
            // Update button text based on mode
            const executeButton = document.getElementById('executeButton');
            executeButton.textContent = mode === 'data' ? 'Execute Query' : 'Find Files';
            executeButton.className = mode === 'data' ? 'btn btn-primary' : 'btn btn-info';
            
            // Clear results and hide clear button
            clearResults();
        }

        async function executeQuery() {
            const mode = document.getElementById('queryMode').value;
            const filters = getFilters();
            const orders = mode === 'data' ? getOrders() : [];
            const limit = mode === 'data' ? parseInt(document.getElementById('limitInput').value) : null;

            if (!filters.length) {
                alert('Please add at least one filter');
                return;
            }

            try {
                const response = await fetch('http://127.0.0.1:5000/query', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        mode,
                        filters,
                        orders,
                        limit
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                if (data.error) {
                    throw new Error(data.error);
                }

                if (mode === 'data') {
                    displayResults(data.results);
                } else {
                    displayParquetFiles(data.parquet_files);
                }
            } catch (error) {
                console.error('Error executing query:', error);
                alert('Failed to execute query: ' + error.message);
            }
        }

        function displayResults(results) {
            if (!results || results.length === 0) {
                document.getElementById('results').innerHTML = '<p>No results found</p>';
                document.getElementById('exportButton').style.display = 'none';
                document.getElementById('clearButton').style.display = 'flex';
                document.getElementById('resultsSection').style.display = 'block';
                return;
            }

            // Store results globally for CSV export
            queryResults = results;

            // Show export button when we have results
            document.getElementById('exportButton').style.display = 'flex';
            document.getElementById('clearButton').style.display = 'flex';

            const columns = Object.keys(results[0]);
            
            // Create header
            const headerRow = document.createElement('tr');
            columns.forEach(col => {
                const th = document.createElement('th');
                th.textContent = col;
                headerRow.appendChild(th);
            });
            
            const resultsHeader = document.getElementById('resultsHeader');
            resultsHeader.innerHTML = '';
            resultsHeader.appendChild(headerRow);
            
            // Create body
            const tbody = document.getElementById('resultsBody');
            tbody.innerHTML = '';
            
            results.forEach(row => {
                const tr = document.createElement('tr');
                columns.forEach(col => {
                    const td = document.createElement('td');
                    td.textContent = row[col] === null ? '' : row[col];
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
            
            document.getElementById('resultsSection').style.display = 'block';
        }

        function displayParquetFiles(files) {
            document.getElementById('exportButton').style.display = 'none';
            document.getElementById('clearButton').style.display = 'block';
            const resultsHeader = document.getElementById('resultsHeader');
            const resultsBody = document.getElementById('resultsBody');
            
            resultsHeader.innerHTML = `
                <tr>
                    <th>File Name</th>
                    <th>Action</th>
                </tr>
            `;
            
            resultsBody.innerHTML = '';
            
            if (!files || files.length === 0) {
                resultsBody.innerHTML = '<tr><td colspan="2">No matching parquet files found</td></tr>';
                document.getElementById('resultsSection').style.display = 'block';
                return;
            }

            files.forEach(file => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${file}</td>
                    <td>
                        <button class="btn btn-primary btn-sm" onclick="downloadParquet('${file}')">
                            Download
                        </button>
                    </td>
                `;
                resultsBody.appendChild(row);
            });
            
            document.getElementById('resultsSection').style.display = 'block';
        }

        async function downloadParquet(filename) {
            try {
                const response = await fetch(`http://127.0.0.1:5000/download/${encodeURIComponent(filename)}`);
                const blob = await response.blob();
                
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            } catch (error) {
                console.error('Error downloading file:', error);
                alert('Failed to download file');
            }
        }

        function exportToCsv() {
            if (!queryResults || queryResults.length === 0) {
                alert('No data to export');
                return;
            }

            // Get headers from the first result object
            const headers = Object.keys(queryResults[0]);
            
            // Create CSV content
            const csvContent = [
                headers.join(','), // Header row
                ...queryResults.map(row => 
                    headers.map(header => {
                        // Handle values that need quotes (contains comma or quotes)
                        let value = row[header] === null ? '' : String(row[header]);
                        if (value.includes(',') || value.includes('"')) {
                            value = `"${value.replace(/"/g, '""')}"`;
                        }
                        return value;
                    }).join(',')
                )
            ].join('\n');

            // Create blob and download
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.setAttribute('href', url);
            link.setAttribute('download', 'query_results.csv');
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function clearResults() {
            document.getElementById('resultsSection').style.display = 'none';
            document.getElementById('resultsHeader').innerHTML = '';
            document.getElementById('resultsBody').innerHTML = '';
            document.getElementById('exportButton').style.display = 'none';
            document.getElementById('clearButton').style.display = 'none';
        }

        function clearAll() {
            clearResults();
            document.getElementById('filters').innerHTML = '';
            document.getElementById('orderingList').innerHTML = '';
            document.getElementById('limitInput').value = '100';
        }

        // Initialize the interface
        loadConfig();
        onModeChange(); // Set initial button state
    </script>
</body>
</html>
