# Column names in your parquet files
primary_filter:
  name: "Primary Location"  # Display name for the first dropdown
  column: "state_name"      # Column name in parquet files
  
secondary_filter:
  name: "Secondary Location"  # Display name for the second dropdown
  column: "city"             # Column name in parquet files
  depends_on: "primary"      # This filter depends on the primary filter

# Available columns for querying
available_columns:
  - "city"
  - "city_ascii"
  - "state_id"
  - "state_name"
  - "county_fips"
  - "county_name"
  - "lat"
  - "lng"
  - "population"
  - "density"
  - "source"
  - "military"
  - "incorporated"
  - "timezone"
  - "ranking"
  - "zips"
  - "id"

# UI Configuration
ui:
  title: "Location Data Explorer"
  primary_placeholder: "Select primary locations..."
  secondary_placeholder: "Select secondary locations..."
  query_button_text: "Query Selected Data"
  clear_button_text: "Clear Results"
  no_results_text: "No results found"
  loading_text: "Loading..."
