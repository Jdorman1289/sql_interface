<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Query Interface</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <style>
        .filter-row {
            margin-bottom: 1rem;
            padding: 1rem;
            border: 1px solid #dee2e6;
            border-radius: 0.25rem;
            background-color: #f8f9fa;
        }
        .results-table {
            margin-top: 2rem;
        }
        .table-container {
            max-height: 500px;
            overflow-y: auto;
        }
        #queryBuilder {
            margin-bottom: 2rem;
        }
        .order-row {
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">Data Query Interface</h1>
        
        <div id="queryBuilder">
            <h3>Filters</h3>
            <div id="filters"></div>
            <button class="btn btn-secondary mt-2" onclick="addFilter()">Add Filter</button>
            
            <h3 class="mt-4">Ordering</h3>
            <div id="ordering"></div>
            <button class="btn btn-secondary mt-2" onclick="addOrder()">Add Order</button>
            
            <div class="mt-4">
                <label for="limitInput" class="form-label">Limit Results</label>
                <input type="number" class="form-control" id="limitInput" min="1" placeholder="Enter limit (optional)">
            </div>
            
            <button class="btn btn-primary mt-4" onclick="executeQuery()">Execute Query</button>
            <button class="btn btn-danger mt-4 ms-2" onclick="clearAll()">Clear All</button>
            <button class="btn btn-success mt-4 ms-2" onclick="exportToCsv()" id="exportButton" style="display: none;">Export to CSV</button>
        </div>

        <div id="resultsSection" style="display: none;">
            <h3>Query Results</h3>
            <div class="table-container">
                <table class="table table-striped results-table">
                    <thead id="resultsHeader"></thead>
                    <tbody id="resultsBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    
    <script>
        let config = {
            available_columns: [],
            operators: []
        };

        let queryResults = null; // Store the query results globally

        async function loadConfig() {
            try {
                const response = await fetch('http://127.0.0.1:5000/config');
                config = await response.json();
                addFilter();
                addOrder();
            } catch (error) {
                console.error('Error loading config:', error);
                alert('Failed to load configuration');
            }
        }

        async function getDistinctValues(column) {
            try {
                const response = await fetch('http://127.0.0.1:5000/distinct', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ column })
                });
                const data = await response.json();
                return data.values || [];
            } catch (error) {
                console.error('Error getting distinct values:', error);
                return [];
            }
        }

        function createColumnSelect(containerId, onChange) {
            const select = document.createElement('select');
            select.className = 'form-select column-select';
            select.innerHTML = '<option value="">Select Column</option>' +
                config.available_columns.map(col => 
                    `<option value="${col}">${col}</option>`
                ).join('');
            select.onchange = onChange;
            return select;
        }

        function createOperatorSelect() {
            const select = document.createElement('select');
            select.className = 'form-select operator-select';
            select.innerHTML = '<option value="">Select Operator</option>' +
                config.operators.map(op => 
                    `<option value="${op.value}">${op.label}</option>`
                ).join('');
            return select;
        }

        function addFilter() {
            const filterContainer = document.createElement('div');
            filterContainer.className = 'filter-row';
            
            const row = document.createElement('div');
            row.className = 'row';
            
            // Column select
            const colDiv = document.createElement('div');
            colDiv.className = 'col';
            const colSelect = createColumnSelect('column', () => {
                // Clear and update value input when column changes
                valueInput.value = '';
                valueInput.style.display = 'block';
                valueSelect.style.display = 'none';
            });
            colDiv.appendChild(colSelect);
            
            // Operator select
            const opDiv = document.createElement('div');
            opDiv.className = 'col';
            const opSelect = createOperatorSelect();
            opDiv.appendChild(opSelect);
            
            // Value input/select
            const valueDiv = document.createElement('div');
            valueDiv.className = 'col';
            const valueInput = document.createElement('input');
            valueInput.className = 'form-control value-input';
            valueInput.placeholder = 'Enter value';
            
            const valueSelect = document.createElement('select');
            valueSelect.className = 'form-control value-select';
            valueSelect.style.display = 'none';
            valueSelect.multiple = true;
            
            valueDiv.appendChild(valueInput);
            valueDiv.appendChild(valueSelect);
            
            // Remove button
            const removeDiv = document.createElement('div');
            removeDiv.className = 'col-auto';
            const removeBtn = document.createElement('button');
            removeBtn.className = 'btn btn-danger';
            removeBtn.innerHTML = 'Remove';
            removeBtn.onclick = () => filterContainer.remove();
            removeDiv.appendChild(removeBtn);
            
            row.appendChild(colDiv);
            row.appendChild(opDiv);
            row.appendChild(valueDiv);
            row.appendChild(removeDiv);
            filterContainer.appendChild(row);
            
            document.getElementById('filters').appendChild(filterContainer);
            
            // Initialize Select2 for the value select
            $(valueSelect).select2({
                width: '100%',
                tags: true,
                tokenSeparators: [',', ' ']
            });
        }

        function addOrder() {
            const orderContainer = document.createElement('div');
            orderContainer.className = 'order-row';
            
            const row = document.createElement('div');
            row.className = 'row';
            
            // Column select
            const colDiv = document.createElement('div');
            colDiv.className = 'col';
            const colSelect = createColumnSelect('orderColumn');
            colDiv.appendChild(colSelect);
            
            // Direction select
            const dirDiv = document.createElement('div');
            dirDiv.className = 'col';
            const dirSelect = document.createElement('select');
            dirSelect.className = 'form-select direction-select';
            dirSelect.innerHTML = `
                <option value="">Select Direction</option>
                <option value="ASC">Ascending</option>
                <option value="DESC">Descending</option>
            `;
            dirDiv.appendChild(dirSelect);
            
            // Remove button
            const removeDiv = document.createElement('div');
            removeDiv.className = 'col-auto';
            const removeBtn = document.createElement('button');
            removeBtn.className = 'btn btn-danger';
            removeBtn.innerHTML = 'Remove';
            removeBtn.onclick = () => orderContainer.remove();
            removeDiv.appendChild(removeBtn);
            
            row.appendChild(colDiv);
            row.appendChild(dirDiv);
            row.appendChild(removeDiv);
            orderContainer.appendChild(row);
            
            document.getElementById('ordering').appendChild(orderContainer);
        }

        function getFilters() {
            const filters = [];
            document.querySelectorAll('.filter-row').forEach(row => {
                const column = row.querySelector('.column-select').value;
                const operator = row.querySelector('.operator-select').value;
                const valueInput = row.querySelector('.value-input');
                const valueSelect = row.querySelector('.value-select');
                
                if (column && operator) {
                    let value;
                    if (valueSelect.style.display === 'none') {
                        value = valueInput.value;
                        // Convert to number if possible
                        if (!isNaN(value) && value !== '') {
                            value = Number(value);
                        }
                    } else {
                        value = $(valueSelect).select2('data').map(item => item.text);
                    }
                    
                    filters.push({ column, operator, value });
                }
            });
            return filters;
        }

        function getOrders() {
            const orders = [];
            document.querySelectorAll('.order-row').forEach(row => {
                const column = row.querySelector('.column-select').value;
                const direction = row.querySelector('.direction-select').value;
                if (column && direction) {
                    orders.push({ column, direction });
                }
            });
            return orders;
        }

        async function executeQuery() {
            try {
                const filters = getFilters();
                const orders = getOrders();
                const limit = document.getElementById('limitInput').value;
                
                const queryData = {
                    filters,
                    orders,
                    limit: limit ? parseInt(limit) : null
                };
                
                const response = await fetch('http://127.0.0.1:5000/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(queryData)
                });
                
                const data = await response.json();
                if (data.error) {
                    alert(data.error);
                    return;
                }
                
                displayResults(data.result);
            } catch (error) {
                console.error('Error executing query:', error);
                alert('Failed to execute query');
            }
        }

        function displayResults(results) {
            queryResults = results; // Store the results
            if (!results || results.length === 0) {
                alert('No results found');
                document.getElementById('exportButton').style.display = 'none';
                return;
            }

            // Show export button when we have results
            document.getElementById('exportButton').style.display = 'inline-block';

            const columns = Object.keys(results[0]);
            
            // Create header
            const headerRow = document.createElement('tr');
            columns.forEach(col => {
                const th = document.createElement('th');
                th.textContent = col;
                headerRow.appendChild(th);
            });
            
            document.getElementById('resultsHeader').innerHTML = '';
            document.getElementById('resultsHeader').appendChild(headerRow);
            
            // Create body
            const tbody = document.getElementById('resultsBody');
            tbody.innerHTML = '';
            
            results.forEach(row => {
                const tr = document.createElement('tr');
                columns.forEach(col => {
                    const td = document.createElement('td');
                    td.textContent = row[col];
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
            
            document.getElementById('resultsSection').style.display = 'block';
        }

        function exportToCsv() {
            if (!queryResults || queryResults.length === 0) {
                alert('No data to export');
                return;
            }

            // Get headers from the first result object
            const headers = Object.keys(queryResults[0]);
            
            // Create CSV content
            const csvContent = [
                headers.join(','), // Header row
                ...queryResults.map(row => 
                    headers.map(header => {
                        // Handle values that need quotes (contains comma or quotes)
                        let value = row[header] === null ? '' : String(row[header]);
                        if (value.includes(',') || value.includes('"')) {
                            value = `"${value.replace(/"/g, '""')}"`;
                        }
                        return value;
                    }).join(',')
                )
            ].join('\n');

            // Create blob and download
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.setAttribute('href', url);
            link.setAttribute('download', 'query_results.csv');
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function clearAll() {
            document.getElementById('filters').innerHTML = '';
            document.getElementById('ordering').innerHTML = '';
            document.getElementById('limitInput').value = '';
            document.getElementById('resultsSection').style.display = 'none';
            document.getElementById('exportButton').style.display = 'none';
            addFilter();
            addOrder();
        }

        // Initialize the interface
        loadConfig();
    </script>
</body>
</html>
